<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>口播跟读提词器 · 阿里云版</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --fg:#e8eaed; --dim:#9aa0a6; --accent:#4c8bf5; --ok:#34a853; --warn:#f9ab00; --err:#ea4335; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; height:100%; }
  body { display:flex; flex-direction:column; max-width:720px; margin:0 auto; padding:12px; gap:10px; }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .sub { color:var(--dim); font-size:12px; }
  textarea, input[type=text], input[type=password] { width:100%; background:var(--panel); color:var(--fg); border:1px solid #2a2f3a; border-radius:8px; padding:10px; font-size:15px; }
  textarea { height:120px; resize:vertical; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--dim); }
  select, input[type=range] { background:var(--panel); color:var(--fg); border:1px solid #2a2f3a; border-radius:6px; padding:6px; font-size:13px; }
  input[type=range] { flex:1; }
  .val { color:var(--fg); min-width:40px; text-align:center; font-weight:600; }
  .btn { width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; }
  .btn:disabled { background:#3a4049; color:#9aa0a6; }
  .btn.secondary { background:var(--panel); color:var(--fg); border:1px solid #2a2f3a; }
  #status { text-align:center; font-size:15px; min-height:24px; padding:8px; border-radius:8px; background:var(--panel); }
  #status.waiting { background:#3d2f00; color:var(--warn); font-weight:700; }
  #status.playing { color:var(--ok); }
  #status.error { background:#3a1518; color:var(--err); }
  #script { flex:1; overflow-y:auto; background:var(--panel); border-radius:10px; padding:16px; font-size:22px; line-height:1.8; letter-spacing:0.5px; white-space:pre-wrap; word-break:break-word; color:#cfd3da; min-height:120px; }
  .controls { display:flex; gap:8px; }
  .controls .btn { flex:1; padding:10px; font-size:14px; }
  .hint { font-size:12px; color:var(--dim); }
  #check { font-size:11px; color:var(--dim); line-height:1.7; }
  #check .ok { color:var(--ok); } #check .bad { color:var(--err); }
  details { background:var(--panel); border:1px solid #2a2f3a; border-radius:8px; padding:10px; }
  summary { cursor:pointer; font-size:14px; color:var(--fg); }
  .field { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
  .field label { font-size:12px; color:var(--dim); }
  #credState { font-size:12px; color:var(--ok); }
</style>
</head>
<body>
  <h1>口播跟读提词器 <span class="sub">· 阿里云版（连续念 · 卡壳等你 · 逐字无级变速）</span></h1>

  <details id="credBox">
    <summary>🔑 凭据设置（首次使用必填，只存你手机本地）</summary>
    <div class="field">
      <label>AccessKey ID</label>
      <input type="text" id="credId" placeholder="LTAI5t...">
    </div>
    <div class="field">
      <label>AccessKey Secret</label>
      <input type="password" id="credSecret" placeholder="输入 Secret">
    </div>
    <div class="field">
      <label>AppKey（项目 Appkey）</label>
      <input type="text" id="credAppkey" placeholder="Oi6S0e...">
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn secondary" id="btnSaveCred" style="flex:1;">保存凭据</button>
      <span id="credState"></span>
    </div>
  </details>

  <textarea id="text" placeholder="粘贴你要跟读的文案，然后点「生成并开始」"></textarea>

  <div class="row">
    <label>音色</label>
    <select id="voice">
      <option value="aixia" selected>艾夏（女）</option>
      <option value="xiaoyun">小云（女）</option>
      <option value="sitong">思彤（女）</option>
      <option value="aiqi">艾琪（女）</option>
    </select>
    <label>语速</label>
    <input type="range" id="rate" min="0.5" max="1.6" step="0.05" value="1.0">
    <span class="val" id="rateVal">1.00×</span>
  </div>
  <div class="row">
    <label>音量增益</label>
    <input type="range" id="vol" min="1.0" max="3.0" step="0.1" value="1.6">
    <span class="val" id="volVal">1.6×</span>
  </div>

  <button class="btn" id="btn">生成并开始</button>

  <div id="status">请先点上方「凭据设置」填入阿里云凭据，再粘贴文案</div>

  <div id="script">跟读文案会显示在这里</div>

  <div class="controls">
    <button class="btn secondary" id="btnPause" disabled>暂停 / 继续</button>
    <button class="btn secondary" id="btnReset" disabled>重新开始</button>
  </div>

  <div class="hint">💡 戴耳机跟读（耳机出声、麦克风收你的声）。音量小就把「音量增益」拉高（最大 3 倍）。凭据只存在你手机本地，不会上传到任何服务器。</div>
  <div id="check"></div>

<script>
'use strict';
const SEG_LEN = 250; // 每段字数上限（普通合成约 300 字上限，留余量）
const CRED_KEY = 'ali_creds_v1';

// ---------- 凭据（localStorage，不硬编码） ----------
function getCreds() {
  try {
    const c = localStorage.getItem(CRED_KEY);
    if (c) { const o = JSON.parse(c); if (o.id && o.secret && o.appkey) return o; }
  } catch (e) {}
  return null;
}
function saveCreds(id, secret, appkey) {
  localStorage.setItem(CRED_KEY, JSON.stringify({ id: id.trim(), secret: secret.trim(), appkey: appkey.trim() }));
}

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const elText = $('text'), elVoice = $('voice'), elRate = $('rate'), elRateVal = $('rateVal');
const elVol = $('vol'), elVolVal = $('volVal');
const elBtn = $('btn'), elStatus = $('status'), elScript = $('script');
const elBtnPause = $('btnPause'), elBtnReset = $('btnReset'), elCheck = $('check');
const elCredId = $('credId'), elCredSecret = $('credSecret'), elCredAppkey = $('credAppkey');
const elBtnSaveCred = $('btnSaveCred'), elCredState = $('credState'), elCredBox = $('credBox');

// ---------- 状态 ----------
let audio = null, audioUrl = null, audioCtx2 = null, gainNode = null;
let stream = null, micCtx = null, analyser = null, dataArr = null;
let baseRate = 1.0, currentRate = 1.0, volumeBoost = 1.6;
const MIN_RATE = 0.5, MAX_RATE = 1.5;
let playing = false, waiting = false, paused = false, finished = false;
let lastVoice = 0, recentSamples = [], monitorTimer = null;
let voiceThreshold = 0.03;
const STALL_MS = 1600;

function setStatus(msg, cls) { elStatus.textContent = msg; elStatus.className = cls || ''; }

// ---------- 能力自检 ----------
(function checkCaps() {
  const rows = [
    ['HTTPS 安全上下文', window.isSecureContext],
    ['麦克风 getUserMedia', !!navigator.mediaDevices && !!navigator.mediaDevices.getUserMedia],
    ['WebSocket', 'WebSocket' in window],
    ['Web Crypto（签名用）', !!(window.crypto && crypto.subtle)],
  ];
  elCheck.innerHTML = rows.map(([n, ok]) =>
    '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓' : '✗') + ' ' + n + '</span>').join(' &nbsp;·&nbsp; ');
})();

// ---------- 凭据 UI ----------
function refreshCredState() {
  const c = getCreds();
  if (c) {
    elCredState.textContent = '✓ 已保存（ID: ' + c.id.slice(0, 8) + '…）';
    elCredBox.open = false;
    setStatus('已就绪，粘贴文案后点「生成并开始」');
  } else {
    elCredState.textContent = '';
    elCredBox.open = true;
    setStatus('请先在上方「凭据设置」填入阿里云凭据');
  }
}
elBtnSaveCred.addEventListener('click', () => {
  const id = elCredId.value.trim(), secret = elCredSecret.value.trim(), appkey = elCredAppkey.value.trim();
  if (!id || !secret || !appkey) { elCredState.textContent = '⚠ 三项都要填'; return; }
  saveCreds(id, secret, appkey);
  refreshCredState();
});
refreshCredState();

elRate.addEventListener('input', () => { baseRate = parseFloat(elRate.value); elRateVal.textContent = baseRate.toFixed(2) + '×'; });
elVol.addEventListener('input', () => { volumeBoost = parseFloat(elVol.value); elVolVal.textContent = volumeBoost.toFixed(1) + '×'; });

// ---------- 工具 ----------
function percentEncode(s) { return encodeURIComponent(s).replace(/[!'()*]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase()); }
function uuid() { return crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join(''); }
function iso8601() { return new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'); }
async function hmacSha1(key, data) {
  const enc = new TextEncoder();
  const ck = await crypto.subtle.importKey('raw', enc.encode(key), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', ck, enc.encode(data));
  return new Uint8Array(sig);
}
function bytesToBase64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

// ---------- Token 获取（RPC 签名） ----------
async function getToken() {
  const creds = getCreds();
  const params = {
    AccessKeyId: creds.id, Action: 'CreateToken', Format: 'JSON',
    SignatureMethod: 'HMAC-SHA1', SignatureNonce: uuid(),
    SignatureVersion: '1.0', Timestamp: iso8601(),
    Version: '2019-02-28', RegionId: 'cn-shanghai',
  };
  const sorted = Object.keys(params).sort();
  const canonicalized = sorted.map(k => percentEncode(k) + '=' + percentEncode(params[k])).join('&');
  const stringToSign = 'POST&' + percentEncode('/') + '&' + percentEncode(canonicalized);
  const sigBytes = await hmacSha1(creds.secret + '&', stringToSign);
  params.Signature = bytesToBase64(sigBytes);
  const resp = await fetch('https://nls-meta.cn-shanghai.aliyuncs.com/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(params).toString(),
  });
  const data = await resp.json();
  if (!data.Token || !data.Token.Id) throw new Error(data.ErrMsg || '获取 Token 失败');
  return data.Token.Id;
}

// ---------- 单段 WebSocket 合成 ----------
function synthOne(token, text, voice, appkey) {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket('wss://nls-gateway-cn-shanghai.aliyuncs.com/ws/v1?token=' + token);
    ws.binaryType = 'arraybuffer';
    const chunks = [];
    const msg = {
      header: { message_id: uuid(), task_id: uuid(), namespace: 'SpeechSynthesizer', name: 'StartSynthesis', appkey: appkey },
      payload: { text: text, voice: voice, format: 'mp3', sample_rate: 16000, volume: 80, speech_rate: 0, pitch_rate: 0 },
      context: { sdk: { name: 'nls-js', version: '1.0', language: 'js' } },
    };
    let settled = false;
    ws.onopen = () => ws.send(JSON.stringify(msg));
    ws.onmessage = (e) => {
      if (typeof e.data === 'string') {
        const d = JSON.parse(e.data);
        const name = d.header && d.header.name;
        if (name === 'SynthesisCompleted') { try { ws.close(); } catch (err) {} }
        else if (name === 'TaskFailed') { if (!settled) { settled = true; reject(new Error(d.header.status_text || '合成失败')); } }
      } else {
        chunks.push(new Uint8Array(e.data));
      }
    };
    ws.onclose = () => {
      if (settled) return;
      settled = true;
      if (chunks.length) {
        const total = chunks.reduce((s, c) => s + c.length, 0);
        const buf = new Uint8Array(total);
        let off = 0;
        for (const c of chunks) { buf.set(c, off); off += c.length; }
        resolve(buf);
      } else { reject(new Error('未收到音频')); }
    };
    ws.onerror = () => { if (!settled) { settled = true; reject(new Error('连接阿里云失败')); } };
    setTimeout(() => { if (!settled) { settled = true; try { ws.close(); } catch (err) {} reject(new Error('合成超时')); } }, 30000);
  });
}

// ---------- 分段 ----------
function splitByLength(text, max) {
  const r = [];
  let cur = '';
  for (const ch of text) {
    cur += ch;
    if (cur.length >= max && '。！？；…\n，、'.includes(ch)) {
      const s = cur.trim();
      if (s) r.push(s);
      cur = '';
    }
  }
  const t = cur.trim();
  if (t) r.push(t);
  return r.length ? r : [text];
}

// ---------- 整段合成 ----------
async function synthAll(text, voice, onProgress) {
  const creds = getCreds();
  const segments = splitByLength(text, SEG_LEN);
  const token = await getToken();
  const parts = [];
  for (let i = 0; i < segments.length; i++) {
    if (onProgress) onProgress(i + 1, segments.length);
    parts.push(await synthOne(token, segments[i], voice, creds.appkey));
  }
  const total = parts.reduce((s, p) => s + p.length, 0);
  const buf = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { buf.set(p, off); off += p.length; }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' }));
}

// ---------- 麦克风 ----------
async function startMic() {
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (micCtx.state === 'suspended') micCtx.resume();
  const src = micCtx.createMediaStreamSource(stream);
  analyser = micCtx.createAnalyser();
  analyser.fftSize = 1024;
  src.connect(analyser);
  dataArr = new Uint8Array(analyser.fftSize);
}
function getLevel() {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(dataArr);
  let s = 0;
  for (let i = 0; i < dataArr.length; i++) { const v = (dataArr[i] - 128) / 128; s += v * v; }
  return Math.sqrt(s / dataArr.length);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
async function calibrate() {
  const samples = [];
  const t0 = performance.now();
  while (performance.now() - t0 < 1500) { samples.push(getLevel()); await sleep(30); }
  samples.sort((a, b) => a - b);
  const base = samples[Math.floor(samples.length * 0.6)] || 0.01;
  voiceThreshold = Math.max(base * 3.5, 0.015);
}

// ---------- 跟读闭环 ----------
function startMonitor() {
  if (monitorTimer) clearInterval(monitorTimer);
  monitorTimer = setInterval(() => {
    if (!playing || paused || finished || !audio) return;
    const now = performance.now();
    const speaking = getLevel() > voiceThreshold;
    if (speaking) lastVoice = now;
    recentSamples.push(speaking ? 1 : 0);
    if (recentSamples.length > 10) recentSamples.shift(); // 约 3 秒窗口

    // 卡壳：用户完全停 1.5 秒 → 停等
    if (now - lastVoice > 1500) {
      if (!waiting) {
        waiting = true;
        audio.playbackRate = 0.06;
        setStatus('你停下来了，等你跟上…', 'waiting');
      }
      return;
    }
    if (waiting) {
      waiting = false;
      setStatus('继续跟读', 'playing');
    }

    // 快慢自适应：语音占比 → 目标语速（连续映射，无死区）
    if (recentSamples.length >= 5) {
      const ratio = recentSamples.reduce((a, b) => a + b, 0) / recentSamples.length;
      // ratio 0.25 → MIN，ratio 0.8 → MAX，中间线性
      let target;
      if (ratio <= 0.25) target = MIN_RATE;
      else if (ratio >= 0.8) target = MAX_RATE;
      else target = MIN_RATE + (ratio - 0.25) / 0.55 * (MAX_RATE - MIN_RATE);
      currentRate += (target - currentRate) * 0.4; // 平滑过渡
      audio.playbackRate = currentRate;
      if (!waiting) setStatus('跟读中 · 语速 ' + currentRate.toFixed(2) + '×', 'playing');
    }
  }, 300);
}

// ---------- 播放 ----------
function startPlayback() {
  if (audio) { audio.pause(); audio = null; }
  if (audioCtx2) { try { audioCtx2.close(); } catch (e) {} audioCtx2 = null; }

  audio = new Audio(audioUrl);
  audio.preservesPitch = true;
  audio.playbackRate = baseRate;
  currentRate = baseRate;
  recentSamples = [];
  waiting = false; paused = false; finished = false;
  lastVoice = performance.now();

  try {
    audioCtx2 = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx2.createMediaElementSource(audio);
    gainNode = audioCtx2.createGain();
    gainNode.gain.value = volumeBoost;
    src.connect(gainNode);
    gainNode.connect(audioCtx2.destination);
  } catch (e) { gainNode = null; }

  audio.onended = () => { finished = true; playing = false; setStatus('✓ 跟读完成', 'playing'); };
  audio.onerror = () => { finished = true; playing = false; setStatus('播放出错', 'error'); };

  playing = true;
  setStatus('跟读中… 念起来吧', 'playing');
  audio.play().catch(e => setStatus('播放失败：' + e.message, 'error'));
  startMonitor();
}

// ---------- 主流程 ----------
async function main() {
  if (!getCreds()) { elCredBox.open = true; setStatus('请先在上方「凭据设置」填入阿里云凭据', 'error'); return; }
  const text = elText.value.trim();
  if (!text) { setStatus('请先粘贴文案', 'error'); return; }

  elBtn.disabled = true;
  elBtn.textContent = '生成中…';
  setStatus('正在生成语音（阿里云）…');

  try {
    if (audioUrl) URL.revokeObjectURL(audioUrl);
    await startMic();
    const url = await synthAll(text, elVoice.value, (done, total) => {
      setStatus('正在生成语音… 第 ' + done + '/' + total + ' 段');
    });
    audioUrl = url;
  } catch (e) {
    elBtn.disabled = false;
    elBtn.textContent = '生成并开始';
    setStatus('❌ ' + e.message, 'error');
    return;
  }

  elBtn.disabled = false;
  elBtn.textContent = '重新生成';
  elBtnPause.disabled = false;
  elBtnReset.disabled = false;
  elScript.textContent = text;

  setStatus('校准环境噪音…');
  await calibrate();
  startPlayback();
}

// ---------- 事件 ----------
elBtn.addEventListener('click', main);
elBtnPause.addEventListener('click', () => {
  if (!audio) return;
  paused = !paused;
  if (paused) { audio.pause(); setStatus('已暂停', ''); }
  else { audio.play(); lastVoice = performance.now(); setStatus(waiting ? '继续跟读' : '跟读中…', 'playing'); }
});
elBtnReset.addEventListener('click', () => {
  if (audio) { audio.pause(); audio = null; }
  if (audioCtx2) { try { audioCtx2.close(); } catch (e) {} audioCtx2 = null; }
  playing = false; finished = false; paused = false;
  if (monitorTimer) clearInterval(monitorTimer);
  elScript.textContent = '跟读文案会显示在这里';
  setStatus('已重置，点「生成并开始」重新来');
  elBtnPause.disabled = true;
  elBtnReset.disabled = true;
  elBtn.textContent = '生成并开始';
});
</script>
</body>
</html>
