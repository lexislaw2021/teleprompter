<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>口播跟读提词器 · 手机语音版</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --fg:#e8eaed; --dim:#9aa0a6; --accent:#4c8bf5; --ok:#34a853; --warn:#f9ab00; --err:#ea4335; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; height:100%; }
  body { display:flex; flex-direction:column; max-width:720px; margin:0 auto; padding:12px; gap:10px; }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .sub { color:var(--dim); font-size:12px; }
  textarea { width:100%; height:120px; background:var(--panel); color:var(--fg); border:1px solid #2a2f3a; border-radius:8px; padding:10px; font-size:15px; resize:vertical; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--dim); }
  select, input[type=range] { background:var(--panel); color:var(--fg); border:1px solid #2a2f3a; border-radius:6px; padding:6px; font-size:13px; }
  input[type=range] { flex:1; }
  #rateVal { color:var(--fg); min-width:34px; text-align:center; font-weight:600; }
  .btn { width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; }
  .btn:disabled { background:#3a4049; color:#9aa0a6; }
  .btn.secondary { background:var(--panel); color:var(--fg); border:1px solid #2a2f3a; }
  #status { text-align:center; font-size:15px; min-height:24px; padding:8px; border-radius:8px; background:var(--panel); }
  #status.waiting { background:#3d2f00; color:var(--warn); font-weight:700; }
  #status.playing { color:var(--ok); }
  #status.error { background:#3a1518; color:var(--err); }
  #script { flex:1; overflow-y:auto; background:var(--panel); border-radius:10px; padding:16px; font-size:22px; line-height:1.8; letter-spacing:0.5px; white-space:pre-wrap; word-break:break-word; color:#cfd3da; min-height:120px; }
  .controls { display:flex; gap:8px; }
  .controls .btn { flex:1; padding:10px; font-size:14px; }
  .hint { font-size:12px; color:var(--dim); }
  #check { font-size:11px; color:var(--dim); line-height:1.7; }
  #check .ok { color:var(--ok); } #check .bad { color:var(--err); }
</style>
</head>
<body>
  <h1>口播跟读提词器 <span class="sub">· 手机语音版（连续念 · 卡壳等你 · 快慢自适应）</span></h1>

  <textarea id="text" placeholder="粘贴你要跟读的文案，然后点「开始跟读」"></textarea>

  <div class="row">
    <label>音色</label>
    <select id="voice"></select>
    <label>基础语速</label>
    <input type="range" id="rate" min="0.5" max="1.8" step="0.05" value="0.95">
    <span id="rateVal">0.95×</span>
  </div>

  <button class="btn" id="btn">开始跟读</button>

  <div id="status">请粘贴文案后点「开始跟读」</div>

  <div id="script">跟读文案会显示在这里</div>

  <div class="controls">
    <button class="btn secondary" id="btnPause" disabled>暂停 / 继续</button>
    <button class="btn secondary" id="btnReset" disabled>重新开始</button>
  </div>

  <div class="hint">💡 请用 <b>Edge / Chrome</b> 浏览器打开（Firefox 安卓没有语音朗读）。戴耳机跟读（耳机出声、麦克风收你的声）。跟读中可点「暂停/继续」。</div>
  <div id="check"></div>

<script>
'use strict';
const synth = window.speechSynthesis;

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const elText = $('text'), elVoice = $('voice'), elRate = $('rate'), elRateVal = $('rateVal');
const elBtn = $('btn'), elStatus = $('status'), elScript = $('script');
const elBtnPause = $('btnPause'), elBtnReset = $('btnReset'), elCheck = $('check');

// ---------- 状态 ----------
let segments = [];
let idx = 0;
let baseRate = 0.95;
let currentRate = 0.95;
const MIN_RATE = 0.5, MAX_RATE = 1.6;
let running = false, waiting = false, paused = false, stopped = false;
let gen = 0;
let stream = null, audioCtx = null, analyser = null, dataArr = null;
let voiceThreshold = 0.03;
let lastVoice = 0;
let recentSamples = [];
let vadTimer = null;
const STALL_MS = 1600;

function setStatus(msg, cls) { elStatus.textContent = msg; elStatus.className = cls || ''; }

// ---------- 能力自检 ----------
(function checkCaps() {
  const rows = [
    ['HTTPS 安全上下文', window.isSecureContext],
    ['语音朗读 speechSynthesis', !!synth],
    ['麦克风 getUserMedia', !!navigator.mediaDevices && !!navigator.mediaDevices.getUserMedia],
  ];
  elCheck.innerHTML = rows.map(([n, ok]) =>
    '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓' : '✗') + ' ' + n + '</span>').join(' &nbsp;·&nbsp; ');
  if (!synth) setStatus('此浏览器不支持语音朗读，请换 Edge/Chrome', 'error');
})();

// ---------- 音色加载（getVoices 异步） ----------
function loadVoices() {
  const voices = synth.getVoices();
  const zh = voices.filter(v => v.lang && v.lang.toLowerCase().indexOf('zh') === 0);
  elVoice.innerHTML = '';
  if (zh.length === 0) {
    elVoice.innerHTML = '<option value="">（系统中文音色）</option>';
    return;
  }
  zh.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name + '（' + v.lang + '）';
    elVoice.appendChild(o);
  });
}
loadVoices();
if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

function pickVoice() {
  const voices = synth.getVoices();
  const name = elVoice.value;
  if (name) {
    const v = voices.find(v => v.name === name);
    if (v) return v;
  }
  return voices.find(v => v.lang && v.lang.toLowerCase().indexOf('zh') === 0) || null;
}

elRate.addEventListener('input', () => {
  baseRate = parseFloat(elRate.value);
  elRateVal.textContent = baseRate.toFixed(2) + '×';
});

// ---------- 切句 ----------
function splitSegments(text) {
  const r = [];
  let c = '';
  for (const ch of text) {
    c += ch;
    if ('。！？；…\n'.includes(ch)) {
      const s = c.trim();
      if (s) r.push(s);
      c = '';
    }
  }
  const t = c.trim();
  if (t) r.push(t);
  return r;
}

// ---------- 麦克风 ----------
async function startMic() {
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  src.connect(analyser);
  dataArr = new Uint8Array(analyser.fftSize);
}
function getLevel() {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(dataArr);
  let s = 0;
  for (let i = 0; i < dataArr.length; i++) { const v = (dataArr[i] - 128) / 128; s += v * v; }
  return Math.sqrt(s / dataArr.length);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
async function calibrate() {
  const samples = [];
  const t0 = performance.now();
  while (performance.now() - t0 < 1500) { samples.push(getLevel()); await sleep(30); }
  samples.sort((a, b) => a - b);
  const base = samples[Math.floor(samples.length * 0.6)] || 0.01;
  voiceThreshold = Math.max(base * 3.5, 0.015);
}

// ---------- VAD 持续采样 ----------
function startVAD() {
  if (vadTimer) clearInterval(vadTimer);
  vadTimer = setInterval(() => {
    if (!running) return;
    const speaking = getLevel() > voiceThreshold;
    if (speaking) lastVoice = performance.now();
    recentSamples.push(speaking ? 1 : 0);
    if (recentSamples.length > 24) recentSamples.shift();
  }, 500);
}

// ---------- 朗读核心 ----------
function playNext(myGen) {
  if (stopped || myGen !== gen) return;
  if (idx >= segments.length) { finish(myGen); return; }

  const seg = segments[idx];
  const u = new SpeechSynthesisUtterance(seg);
  u.lang = 'zh-CN';
  u.rate = currentRate;
  const v = pickVoice();
  if (v) u.voice = v;

  let done = false;
  const mark = () => {
    if (done) return;
    done = true;
    idx++;
    onSegmentEnd(myGen);
  };
  u.onend = mark;
  u.onerror = mark;

  try { if (synth.paused) synth.resume(); } catch (e) {}
  synth.speak(u);

  // 超时兜底
  const ms = Math.max(2500, seg.length * 400 / currentRate + 1500);
  setTimeout(() => { if (!done) mark(); }, ms);
}

function onSegmentEnd(myGen) {
  if (stopped || myGen !== gen) return;
  if (idx >= segments.length) { finish(myGen); return; }

  // 卡壳检测：用户最近无声超时 → 停等
  if (performance.now() - lastVoice > STALL_MS) {
    waiting = true;
    setStatus('你停下来了，等你跟上…', 'waiting');
    waitForVoice(myGen).then(() => {
      if (stopped || myGen !== gen) return;
      waiting = false;
      setStatus('继续跟读', 'playing');
      playNext(myGen);
    });
  } else {
    adjustRate();
    playNext(myGen);
  }
}

function adjustRate() {
  if (recentSamples.length < 10) return;
  const ratio = recentSamples.reduce((a, b) => a + b, 0) / recentSamples.length;
  if (ratio > 0.62 && currentRate < MAX_RATE) {
    currentRate = Math.min(currentRate + 0.03, MAX_RATE);
  } else if (ratio < 0.35 && currentRate > MIN_RATE) {
    currentRate = Math.max(currentRate - 0.03, MIN_RATE);
  }
}

function waitForVoice(myGen) {
  return new Promise(resolve => {
    function check() {
      if (stopped || myGen !== gen) { resolve(); return; }
      if (getLevel() > voiceThreshold) { resolve(); return; }
      requestAnimationFrame(check);
    }
    requestAnimationFrame(check);
  });
}

function finish(myGen) {
  if (myGen !== gen) return;
  running = false;
  if (vadTimer) clearInterval(vadTimer);
  setStatus('✓ 跟读完成', 'playing');
  elBtn.textContent = '重新跟读';
}

// ---------- 主流程 ----------
async function main() {
  const text = elText.value.trim();
  if (!text) { setStatus('请先粘贴文案', 'error'); return; }

  segments = splitSegments(text);
  if (segments.length === 0) { setStatus('没有可读内容', 'error'); return; }

  if (running) { stopAll(); }

  elBtn.disabled = true;
  setStatus('请求麦克风 + 校准…');

  try {
    await startMic();
    await calibrate();
  } catch (e) {
    elBtn.disabled = false;
    setStatus('❌ 麦克风不可用：' + e.message, 'error');
    return;
  }

  elBtn.disabled = false;
  elBtn.textContent = '重新跟读';
  elBtnPause.disabled = false;
  elBtnReset.disabled = false;
  elScript.textContent = text;

  const myGen = ++gen;
  idx = 0;
  currentRate = baseRate;
  waiting = false; paused = false; stopped = false;
  running = true;
  lastVoice = performance.now();
  recentSamples = [];

  startVAD();
  setStatus('跟读中… 念起来吧', 'playing');
  playNext(myGen);
}

function stopAll() {
  const myGen = ++gen;
  running = false;
  stopped = true;
  try { synth.cancel(); } catch (e) {}
  if (vadTimer) clearInterval(vadTimer);
}

// ---------- 事件 ----------
elBtn.addEventListener('click', main);

elBtnPause.addEventListener('click', () => {
  if (!running) return;
  paused = !paused;
  if (paused) {
    try { synth.pause(); } catch (e) {}
    setStatus('已暂停', '');
  } else {
    try { synth.resume(); } catch (e) {}
    lastVoice = performance.now(); // 重置，避免暂停期间的「假卡壳」
    setStatus(waiting ? '继续跟读' : '跟读中…', 'playing');
  }
});

elBtnReset.addEventListener('click', () => {
  stopAll();
  elScript.textContent = '跟读文案会显示在这里';
  setStatus('已重置，点「开始跟读」重新来');
  elBtnPause.disabled = true;
  elBtnReset.disabled = true;
  elBtn.textContent = '开始跟读';
});
</script>
</body>
</html>
